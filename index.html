<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2B4A94">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日語手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#18213A; --muted:#5B6782; --line:#DCE1EB;
  --accent:#2B4A94; --accent-ink:#FFFFFF; --accent-soft:#E3E9F7;
  --warn:#8A5200; --warn-soft:#FFF0D2; --danger:#B3261E; --dim-red:#CC1B1B;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-ja:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-min:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0F131C; --surface:#171D2A; --ink:#E9EDF6; --muted:#9AA6C0; --line:#28314A;
    --accent:#8FAAF0; --accent-ink:#0F1730; --accent-soft:#1F2A47;
    --warn:#F2C572; --warn-soft:#3A2E14; --danger:#F2867F; --dim-red:#FF6B6B;
  }
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 var(--f-zh);-webkit-text-size-adjust:100%}
:lang(ja){font-family:var(--f-ja)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:600px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{margin:0;font:700 28px/1.2 var(--f-min);letter-spacing:.04em}
.top p{margin:2px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:10px 10px 10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.5}
.notice .btn{background:transparent;border-color:currentColor;color:inherit}

.compose{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.compose textarea{display:block;width:100%;min-height:56px;max-height:220px;padding:6px 0;border:0;outline:0;background:transparent;resize:none;font-size:18px;line-height:1.5}
.compose textarea::placeholder{color:var(--muted);opacity:.8}
.compose-f{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}

.pending{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.pending .btn{background:transparent;border-color:currentColor;color:inherit}

.bar{display:flex;align-items:center;gap:12px;margin:22px 0 4px}
.search{position:relative;flex:1;min-width:0}
.search .ic{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--muted);width:18px;height:18px}
.search input{width:100%;min-height:42px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.list{list-style:none;margin:0;padding:0}
.empty{padding:36px 8px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.list>li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.row,.g{display:block;width:100%;text-align:left;padding:14px 4px;border:0;background:none}
.list>li>.row,.list>li>.g{width:auto;flex:1 1 auto;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:center}
.row:active,.g:active{background:var(--accent-soft)}
.rd{font-size:12px;color:var(--muted);line-height:1.3;letter-spacing:.04em}
.hw{font:600 22px/1.3 var(--f-min);overflow-wrap:anywhere}
.mn{font-size:15px;overflow-wrap:anywhere}
.pos{margin-top:2px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.g-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.g-t{font:700 18px/1.4 var(--f-min);overflow-wrap:anywhere}
.g-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-p{margin-top:4px;color:var(--muted);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.drag-handle{touch-action:none;color:var(--muted);cursor:grab;flex:none}
.drag-handle:active{cursor:grabbing}
.list>li.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 6px 18px rgba(20,30,60,.2);border-radius:10px;opacity:.94}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border:0;background:none;color:var(--muted);font-size:12px;letter-spacing:.06em}
.tab b{font:700 20px/1.2 var(--f-min)}
.tab[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.fab{position:fixed;z-index:11;right:max(16px,calc((100vw - 600px)/2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(20,30,60,.28)}
.fab .ic{width:26px;height:26px}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-h{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-t{flex:1;min-width:0;font-weight:700}
.status{font-size:12px;color:var(--muted);margin-inline:4px 10px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 8px;border:0;border-radius:10px;background:none;color:var(--ink)}
.ib.danger{color:var(--danger)}
.ib.armed{background:var(--danger);color:#fff;font-size:14px;padding:0 12px}
.ib.tint{color:var(--accent);font-size:13px}
.ib.star,.star-filter{color:var(--muted)}
.ib.star.on,.star-filter[aria-pressed="true"]{color:var(--warn)}
.ib.star.on .ic,.star-filter[aria-pressed="true"] .ic{fill:currentColor}
.tgl{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;white-space:nowrap;flex:none}
.tgl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tgl .ic{width:16px;height:16px}
.sheet-b{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:600px;margin:0 auto}
.f{display:block;margin-bottom:14px}
.f>span{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.f input,.f textarea{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;line-height:1.55}
.f textarea{resize:vertical;min-height:70px}
.f .big{font:600 24px/1.3 var(--f-min)}
.f input:focus,.f textarea:focus,.g-title:focus,.g-body:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.g-title{display:block;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:700 22px/1.4 var(--f-min)}
.scanbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin:12px 0}
.scanbar .hint{flex:1 1 180px}
.scanbar select{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;max-width:100%}
.g-body{display:block;width:100%;min-height:50vh;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;line-height:1.8;resize:none;white-space:pre-wrap}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sec{margin:0 0 22px}
.sec h2{margin:0 0 6px;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.sec p{margin:0 0 10px;font-size:14px;line-height:1.6}
.sec .btn{margin-bottom:10px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
.small{font-size:12px;color:var(--muted)}

.segrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-b{min-height:38px;padding:0 18px;border:0;background:none;font-size:14px}
.seg-b[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.gview{padding:2px 0}
.tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.8;margin:0 0 14px}
.tw{margin:0 0 18px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;min-width:72px;vertical-align:top;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}
.tbl th{background:var(--accent-soft);font-weight:700}
.tbl tr>*:first-child{border-left:0}.tbl tr>*:last-child{border-right:0}
.tbl tr:first-child>*{border-top:0}.tbl tr:last-child>*{border-bottom:0}
.tbl th:focus,.tbl td:focus{outline:2px solid var(--accent);outline-offset:-2px}
.tbl td.dimcell,.tbl th.dimcell{color:var(--dim-red)}
.gview.pick .tbl td,.gview.pick .tbl th{cursor:pointer}
.gview.pick .tbl td:active,.gview.pick .tbl th:active{background:var(--accent-soft)}
.tacts{display:flex;gap:8px;margin-top:8px}
.toast{position:fixed;z-index:40;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:568px;margin:0 auto;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.5}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.dot{animation:none}}
</style>
</head>
<body>

<div class="app">
  <div id="notice" class="notice" hidden><span id="noticeTxt"></span><button id="noticeBtn" class="btn sm" type="button" hidden></button></div>
  <header class="top">
    <div>
      <h1 lang="ja">日語手帳</h1>
      <p id="counts" aria-live="polite"></p>
    </div>
    <button id="menuBtn" class="ib tint" type="button" aria-label="備份與設定"><span data-icon="download"></span>備份</button>
  </header>

  <section id="view-words" aria-label="單字">
    <div class="compose">
      <label for="wordsIn" class="lbl">新增單字</label>
      <textarea id="wordsIn" rows="2" lang="ja" placeholder="輸入單字，一行一個" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <div class="compose-f">
        <span class="hint">日文或英文都可以，會自動補上讀音與中文意思。</span>
        <button id="addBtn" class="btn primary" type="button">加入並翻譯</button>
      </div>
    </div>
    <div id="pendingBar" class="pending" hidden>
      <span id="pendingTxt"></span>
      <button id="pendingBtn" class="btn sm" type="button">全部翻譯</button>
    </div>
    <div class="bar">
      <label class="search"><span class="sr">搜尋單字</span><span data-icon="search"></span><input id="qWords" type="search" placeholder="搜尋單字、讀音、意思" autocomplete="off"></label>
      <button id="wStarFilter" class="ib star-filter" type="button" aria-label="只看加星號的單字" aria-pressed="false"><span data-icon="star"></span></button>
      <span id="wCount" class="count"></span>
    </div>
    <ul id="wordList" class="list"></ul>
  </section>

  <section id="view-grammar" aria-label="文法" hidden>
    <div class="bar" style="margin-top:0">
      <label class="search"><span class="sr">搜尋文法</span><span data-icon="search"></span><input id="qGrammar" type="search" placeholder="搜尋文法筆記" autocomplete="off"></label>
      <button id="gStarFilter" class="ib star-filter" type="button" aria-label="只看加星號的文法筆記" aria-pressed="false"><span data-icon="star"></span></button>
      <button id="gReorderBtn" class="tgl" type="button" aria-pressed="false"><span data-icon="sort"></span>排序</button>
      <span id="gCount" class="count"></span>
    </div>
    <ul id="gList" class="list"></ul>
  </section>
</div>

<nav class="tabs" aria-label="主要分頁">
  <div class="tabs-in" role="tablist">
    <button class="tab" id="tab-words" role="tab" type="button" aria-selected="true"><b lang="ja">あ</b>單字</button>
    <button class="tab" id="tab-grammar" role="tab" type="button" aria-selected="false"><b lang="ja">文</b>文法</button>
  </div>
</nav>
<button id="fab" class="fab" type="button" aria-label="新增文法筆記" hidden><span data-icon="plus"></span></button>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  var CDN = {
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
    kuroshiro: 'https://cdn.jsdelivr.net/npm/kuroshiro@1/dist/kuroshiro.min.js',
    analyzer: 'https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1/dist/kuroshiro-analyzer-kuromoji.min.js',
    dict: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'
  };

  var S = { tab: 'words', words: [], grammar: [], q: { words: '', grammar: '' }, busy: new Set(),
            loaded: { words: false, grammar: false }, starOnly: { words: false, grammar: false }, reorderGrammar: false };

  function $(id) { return document.getElementById(id); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function str(v) { return typeof v === 'string' ? v.trim() : ''; }

  // ---------- tiny DOM helpers (all text goes through textContent) ----------
  function appendKids(el, k) {
    if (k == null || k === false) return;
    if (Array.isArray(k)) { k.forEach(function (x) { appendKids(el, x); }); return; }
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (var i = 2; i < arguments.length; i++) appendKids(el, arguments[i]);
    return el;
  }
  var ICON = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    camera: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
    trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
    refresh: '<path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/>',
    stop: '<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
    download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
    upload: '<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
    star: '<path d="M12 3.5l2.6 5.6 6.1.8-4.5 4.3 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.3 6.1-.8z"/>',
    grip: '<path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"/>',
    sort: '<path d="M7 15l5 5 5-5M7 9l5-5 5 5"/>'
  };
  function icon(name) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'ic');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICON[name];
    return s;
  }
  function grow(el, max) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight + 2, max || 99999) + 'px';
  }
  var toastTimer;
  function toast(msg, ms) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, ms || 4500);
  }
  function fmtDate(ms) {
    if (!ms) return '';
    try { return new Date(ms).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' }); } catch (e) { return ''; }
  }
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = function () { rej(new Error('load failed: ' + src)); };
      document.head.append(s);
    });
  }

  // ---------- settings (kept beside the data) ----------
  var META_KEY = 'nihongo-techo:meta', metaMem = {};
  function getMeta() {
    try { return Object.assign({}, metaMem, JSON.parse(localStorage.getItem(META_KEY) || '{}')); } catch (e) { return Object.assign({}, metaMem); }
  }
  function setMeta(p) {
    metaMem = Object.assign(metaMem, p);
    try { localStorage.setItem(META_KEY, JSON.stringify(Object.assign(getMeta(), p))); } catch (e) {}
  }

  // ---------- Gemini 辨識（選用）：把整張照片直接交給 Gemini 讀，不用本機的前處理／表格偵測 ----------
  // 好處：不怕頁面彎曲、彩色墨水、虛線、對角分割的表頭；壞處：圖片會送到 Google，需要使用者自己的 API Key。
  var GEMINI_DEFAULT_MODEL = 'gemini-3.8-flash';
  var GEMINI_PROMPT = [

      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      ids.forEach(function (id, idx) {
        if (!id) return;
        var g = S.grammar.find(function (x) { return x.id === id; });
        if (g && g.order !== idx) { g.order = idx; store.patch('grammar', id, { order: idx }).catch(function () {}); }
      });
    }
    gList.addEventListener('pointerdown', function (e) {
      var handle = e.target.closest ? e.target.closest('.drag-handle') : null;
      if (!handle) return;
      var li = handle.closest('li');
      if (!li) return;
      e.preventDefault();
      dragEl = li; pid = e.pointerId;
      dragEl.classList.add('dragging');
      try { handle.setPointerCapture(pid); } catch (e2) {}
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  })();
  $('pendingBtn').addEventListener('click', function () {
    var pend = S.words.filter(function (w) { return !str(w.meaning) && !S.busy.has(w.id); }).slice(0, 20)
      .map(function (w) { return { id: w.id, word: w.word }; });
    if (pend.length) translateItems(pend);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetClose) sheetClose(); });

  store.watch('words', 'createdAt', function (rows) { S.words = rows; S.loaded.words = true; renderWords(); });
  store.watch('grammar', 'updatedAt', function (rows) { S.grammar = rows; S.loaded.grammar = true; renderGrammar(); });
})();
</script>
</body>
